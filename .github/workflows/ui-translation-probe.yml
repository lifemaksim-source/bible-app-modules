name: Разовый тест перевода интерфейса для Bible App
on:
  pull_request:
    paths:
      - .github/workflows/ui-translation-probe.yml
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Таджикский, монгольский и редкие языки
        run: |
          node --input-type=module <<'NODE'
          for (const lang of ['tg','mn','kk','uz','ky','tt','ba','sah','dar','tab']) {
            try {
              const params=new URLSearchParams({client:'gtx',sl:'ru',tl:lang,dt:'t',q:'Библиотека переводов'});
              const result=await fetch('https://translate.googleapis.com/translate_a/single?'+params,{signal:AbortSignal.timeout(6000)});
              const raw=await result.text();
              console.log(lang, result.status, raw.slice(0,180));
            }catch(e){console.log(lang,'error',String(e).slice(0,150));}
          }
          NODE
          node --input-type=module <<'NODE'
          const text='Настройки\n[[[SEP]]] Библиотека переводов\n[[[SEP]]] Загрузить модуль';
          for(const lang of ['tg','mn']){
            const p=new URLSearchParams({client:'gtx',sl:'ru',tl:lang,dt:'t',q:text});
            const a=await (await fetch('https://translate.googleapis.com/translate_a/single?'+p)).json();
            const combined=(a[0]||[]).map(x=>x[0]).join('');
            console.log(lang,JSON.stringify(combined).slice(0,400));
          }
          NODE
