name: Генерация локализаций Bible App для СНГ
on:
  pull_request:
    paths:
      - .github/workflows/ui-translation-probe.yml
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lifemaksim-source/bible-app
          ref: feature/i18n-regional-20261021
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Полные UI-локализации для восьми приоритетных языков
        run: node tools/translate-regional.mjs --languages=tg,mn,kk,uz,ky,tt,ba,sah
      - name: Проверка ключей, переменных и названий книг без зависимостей
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const ru=JSON.parse(readFileSync('src/i18n/locales/ru.json','utf8'));
          const report=JSON.parse(readFileSync('regional-translation-report.json','utf8'));
          let passed=0;
          for(const {code,status} of report.report){
            if(status!=='machine-draft' && status!=='existing')continue;
            const translations=JSON.parse(readFileSync('src/i18n/locales/'+code+'.json','utf8'));
            const books=JSON.parse(readFileSync('src/i18n/books/'+code+'.json','utf8'));
            if(Object.keys(translations).length!==Object.keys(ru).length || Object.keys(books).length!==78)throw Error('Missing '+code+' keys');
            const vars=(s)=>[...s.matchAll(/\{\{([^}]+)\}\}/g)].map(x=>x[1]).sort().join('|');
            for(const [key,value] of Object.entries(ru)){
              if(!(key in translations)||!translations[key].trim()||vars(value)!==vars(translations[key]))throw Error('Broken '+code+' '+key);
            }
            console.log('PASS '+code+': '+Object.keys(ru).length+' UI entries, 78 book names');
            passed++;
          }
          if(!passed)throw Error('No translations generated');
          NODE
      - name: Сохранить локализации без публикации в приложение
        uses: actions/upload-artifact@v4
        with:
          name: regional-ui-priority-drafts
          path: |
            src/i18n/locales/*.json
            src/i18n/books/*.json
            src/i18n/extraLocalizations.ts
            regional-translation-report.json
          retention-days: 7
