# Builds modules from eBible.org, publishes them to the Release "modules" and updates catalog.json.
# Run by hand: Actions → Сборка модулей → Run workflow. «list» — показать переводы eBible для выбора id.
name: Сборка модулей

on:
  push:
    branches: [main]
    paths: ['sources.json', 'tools/**', 'canon/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      languages:
        description: 'Только черновики новых языков с подробным отчётом'
        type: boolean
        default: false
      list:
        description: 'Только показать переводы eBible (коды языков через пробел, например "rus ukr eng")'
        required: false
        default: ''
      dry:
        description: 'Только собрать и проверить: не публиковать файлы и каталог'
        type: boolean
        required: false
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.languages }}
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/requirements-sword.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y libsword-utils diatheke
      - run: npm ci
      - run: npm test
      - name: Список переводов eBible
        if: ${{ inputs.list != '' }}
        run: |
          node tools/build.mjs --list ${{ inputs.list }} > list.txt
          echo "::notice title=Список::$(head -c 3000 list.txt | sed ':a;N;$!ba;s/\n/ | /g')"
      - name: Сборка
        id: build
        if: ${{ inputs.list == '' }}
        continue-on-error: true
        run: node tools/build.mjs
      - name: Опубликовать модули в Release
        if: ${{ inputs.list == '' && !inputs.dry && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modules >/dev/null 2>&1 || gh release create modules --title "Модули" --notes "Файлы модулей. Каталог — catalog.json в корне репозитория."
          shopt -s nullglob; files=(dist/*.db dist/*.db.gz); if [ ${#files[@]} -gt 0 ]; then gh release upload modules "${files[@]}" --clobber; fi
      - name: Обновить catalog.json
        if: ${{ inputs.list == '' && !inputs.dry && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "modules-bot"
          git config user.email "modules-bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || { git commit -m "catalog.json: $(date -u +%F)"; git push; }
      - name: Итог
        if: ${{ inputs.list == '' }}
        run: |
          cat dist/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Отчёт::$(cat dist/report.md | head -c 6000 | sed ':a;N;$!ba;s/\n/ | /g')"
          [ "${{ steps.build.outcome }}" = "success" ]

  languages:
    if: ${{ inputs.languages }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r tools/requirements-sword.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y libsword-utils diatheke
      - run: npm test
      - name: Собрать черновики и сравнить нумерацию
        id: build
        continue-on-error: true
        run: node tools/build.mjs --drafts
      - name: Сохранить отчёты
        if: always()
        run: |
          mkdir -p language-results
          cp dist/report.md language-results/README.md
          for f in work/*/numbering.json work/*/names.json work/*/sword-check.txt; do
            [ -f "$f" ] || continue
            id=$(basename "$(dirname "$f")")
            mkdir -p "language-results/$id"
            cp "$f" "language-results/$id/"
          done
          cat language-results/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-drafts
          path: |
            language-results
            dist/drafts
      - name: Отчёт для проверки в своей ветке
        if: always() && github.ref == 'refs/heads/codex/languages'
        run: |
          git config user.name "modules-bot"
          git config user.email "modules-bot@users.noreply.github.com"
          git checkout --orphan languages-result-new
          git rm -rfq --cached .
          git add -f language-results
          git commit -qm "Нумерация языков: $GITHUB_SHA"
          git push -f origin languages-result-new:codex/languages-results
      - name: Результат проверки
        if: always()
        run: test '${{ steps.build.outcome }}' = success
