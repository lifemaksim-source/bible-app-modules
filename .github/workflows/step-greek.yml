# Source-first validation: no Bible text or generated SQLite committed or uploaded.
name: STEP Bible Greek source QA
on:
  pull_request:
    paths:
      - 'tools/step-greek*'
      - 'sources-step-greek.json'
      - '.github/workflows/step-greek.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check mapping logic using synthetic words
        run: node --test tools/step-greek.test.mjs
      - name: Verify fixed STEP Bible TAGNT source and in-memory SQLite import
        run: |
          node tools/step-greek.mjs --export-local
          test -s work/step-greek-gospels.db
